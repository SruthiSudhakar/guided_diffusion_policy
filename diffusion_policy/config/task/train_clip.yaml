name: none
# name: test

img_obs_horizon: 2
action_horizon: 16
action_dim: 7
ignore_proprioception: True

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    robot0_agentview_left_image:
      shape: [3, 224, 224]
      horizon: ${task.img_obs_horizon} # int
      type: rgb
      ignore_by_policy: False
    robot0_agentview_right_image:
      shape: [3, 224, 224]
      horizon: ${task.img_obs_horizon} # int
      type: rgb
      ignore_by_policy: False
    robot0_eye_in_hand_image:
      shape: [3, 224, 224]
      horizon: ${task.img_obs_horizon} # int
      type: rgb
      ignore_by_policy: False
    language_goal:
      shape: [1024]
      horizon: ${task.img_obs_horizon} # int
      type: low_dim
      ignore_by_policy: False

  action: 
    shape: 
      - ${task.action_dim}
    horizon: ${task.action_horizon}

task_name: &task_name clip
pose_repr: &pose_repr
  obs_pose_repr: relative # abs or rel
  action_pose_repr: relative # abs or rel or delta

env_runner:
  _target_: diffusion_policy.env_runner.robocasa_robomimic_image_runner_eval_clip.RobocasaRobomimicImageRunnerEvalClip

lang_model:
  _target_: diffusion_policy.model.vision.clip_obs_encoder.FrozenOpenCLIPImageEmbedder

dataset:
  _target_: diffusion_policy.dataset.clip_dataset.InMemoryVideoDataset
  frame_width: 224
  frame_height: 224
  sample_fps: 30
  video_fps: 30
  pred_horizon: ${task.action_horizon}
  obs_horizon: ${task.img_obs_horizon}
  validation_split: 0.1
  action_dim: ${task.action_dim}
  swap_rgb: false
  mode: "train"
  data_fraction: 0.9

  lang_model: ${task.lang_model}
  # Option 1: Single path (backward compatible)
  # human_path: "path/to/single/file.hdf5"
  
  # Option 2: List of paths for different tasks
  # human_path: 
  #   - "path/to/task1.hdf5"
  #   - "path/to/task2.hdf5"
  
  # Option 3: Dictionary mapping task names to paths
  # human_path:
  #   OpenSingleDoor: "path/to/open_door.hdf5"
  #   CloseDrawer: "path/to/close_drawer.hdf5"
  #   PnPCabToCounter: "path/to/pnp.hdf5"
  
  human_path:
    # CloseDrawer: "externals/robocasa/datasets/v0.1/single_stage/kitchen_drawer/CloseDrawer/2024-04-30/demo_gentex_im128_randcams_im224.hdf5"
    # PnPSinkToCounter: "externals/robocasa/datasets/v0.1/single_stage/kitchen_pnp/PnPSinkToCounter/2024-04-26_2/expert_demos_fixed_textures_224.hdf5"
    # PnPStoveToCounter: "externals/robocasa/datasets/v0.1/single_stage/kitchen_pnp/PnPStoveToCounter/2024-05-01/demo_gentex_im128_randcams_im224.hdf5"
    # PnPCabToCounter: "externals/robocasa/datasets/v0.1/single_stage/kitchen_pnp/PnPCabToCounter/2024-04-24/demo_gentex_im128_randcams_im224.hdf5"
    # CoffeeServeMug: "externals/robocasa/datasets/v0.1/single_stage/kitchen_coffee/CoffeeServeMug/2024-05-01/demo_gentex_im128_randcams.hdf5"
    # PnPCounterToSink: "externals/robocasa/datasets/v0.1/single_stage/kitchen_pnp/PnPCounterToSink/2024-04-25/demo_gentex_im128_randcams.hdf5"
  aug:
    crop: 0.9
    brightness: 0.2
    contrast: 0.2
    saturation_rgb: 0.2
    saturation_depth: 0.02
    hue_rgb: 0.05
    hue_depth: 0.02
  skip_demos:
    TurnOnStove: ["demo_33", "demo_37"]
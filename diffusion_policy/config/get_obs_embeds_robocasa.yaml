defaults:
  - _self_

name: train_diffusion_unet_clip
experiment_tag: save_states_for_faildetect

_target_: diffusion_policy.workspace.extract_obs_embeds_diffusion_unet_clip_workspace.ExtractObsDiffusionUnetImageWorkspace

task_name: PnPSinkToCounter

task:
  dataset:
    _target_: diffusion_policy.dataset.robocasa_replay_image_dataset.RobocasaReplayImageDataset
    abs_action: false
    dataset_path: externals/robocasa/datasets/v0.1/single_stage/kitchen_pnp/PnPSinkToCounter/2024-04-26_2/demo_gentex_im128_randcams.hdf5
    horizon: 16
    n_obs_steps: 2
    pad_after: 7
    pad_before: 1
    rotation_rep: rotation_6d
    seed: 42
    shape_meta:
      action:
        shape:
        - 7
      obs:
        language_goal:
          shape:
          - 512
        robot0_eye_in_hand_image:
          shape:
          - 3
          - 128
          - 128
          type: rgb
        robot0_agentview_right_image:
          shape:
          - 3
          - 128
          - 128
          type: rgb
        robot0_agentview_left_image:
          shape:
          - 3
          - 128
          - 128
          type: rgb
    use_cache: true
    val_ratio: 0.02

shape_meta: 
  action:
    shape:
    - 7
  obs:
    language_goal:
      shape:
      - 512
    robot0_eye_in_hand_image:
      shape:
      - 3
      - 128
      - 128
      type: rgb
    robot0_agentview_right_image:
      shape:
      - 3
      - 128
      - 128
      type: rgb
    robot0_agentview_left_image:
      shape:
      - 3
      - 128
      - 128
      type: rgb

exp_name: "default"

policy:
  _target_: diffusion_policy.policy.diffusion_unet_image_policy.DiffusionUnetImagePolicy
  cond_predict_scale: true
  diffusion_step_embed_dim: 128
  down_dims:
  - 512
  - 1024
  - 2048
  horizon: 16
  kernel_size: 5
  n_action_steps: 8
  n_groups: 8
  n_obs_steps: 2
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    variance_type: fixed_small
  num_inference_steps: 100
  obs_as_global_cond: true
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta:
      action:
        shape:
        - 7
      obs:
        language_goal:
          shape:
          - 512
        robot0_eye_in_hand_image:
          shape:
          - 3
          - 128
          - 128
          type: rgb
        robot0_agentview_right_image:
          shape:
          - 3
          - 128
          - 128
          type: rgb
        robot0_agentview_left_image:
          shape:
          - 3
          - 128
          - 128
          type: rgb    
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: IMAGENET1K_V1 # or r3m
    resize_shape: [128, 128]
    crop_shape: [126, 126]
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True
  shape_meta:
    action:
      shape:
      - 7
    obs:
      language_goal:
        shape:
        - 512
      robot0_eye_in_hand_image:
        shape:
        - 3
        - 128
        - 128
        type: rgb
      robot0_agentview_right_image:
        shape:
        - 3
        - 128
        - 128
        type: rgb
      robot0_agentview_left_image:
        shape:
        - 3
        - 128
        - 128
        type: rgb

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.95, 0.999]
  eps: 1.0e-8
  lr: 0.0001
  weight_decay: 1.0e-6

training:
  checkpoint_every: 50
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 8000
  resume: false
  rollout_every: 200
  sample_every: 50
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 50
  freeze_encoder: false
  FD_base_policy_ckpt_path: data/checkpoints/dp_model/epoch=1100-val_loss=0.037.ckpt
  FD_save_obs_embeds_path: data/checkpoints/dp_model/human_obs/obs_embeds.pt
  num_inference_steps: 100

  
logging:
  project: diffusion_policy_get_obs_embs
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-val_loss={val_loss:.3f}.ckpt
    k: 50
    mode: min
    monitor_key: val_loss

# multi_run:
#   run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
#   wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${experiment_tag}_${name}_${task_name}/demo_obs_embeds
  sweep:
    dir: data/outputs/${experiment_tag}_${name}_${task_name}/demo_obs_embeds
    subdir: ${hydra.job.num}